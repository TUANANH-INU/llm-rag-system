[tool.ruff]
exclude = [
    "env",
    "env3",
    "migrations",
    "data",
    "tests",
    "third_party",
    "build",
    "dist",
    "services",
]

line-length = 180
target-version = "py310"

lint.select = ["E", "F", "W"]

lint.ignore = [
    "E711", 
    "E712", 
    "W191", 
    "W293", 
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.black]
line-length = 150
target-version = ["py310"]
exclude = '''
/(
    env
  | env3
  | migrations
  | data
  | tests
  | third_party
  | build
  | dist
  | services
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [
    "env",
    "env3",
    "migrations",
    "data",
    "tests",
    "third_party",
    "build",
    "dist",
    "services",
]
